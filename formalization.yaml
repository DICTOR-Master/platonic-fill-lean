  - id: "https://github.com/DICTOR-Master/dehn-canon-lean/blob/9ea20f6dfd64fc3f10f64b1fb59a754a77e5cf57/Challenge.lean"
    relationship: "other"
    note: >-
      The Dehn Canon entry (PALOMAR-2026-11-20-000003): the set-defined
