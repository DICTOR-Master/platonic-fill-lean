  statements:
    - source: "Aristotle's claim refuted (Lagarias-Zong 2012): regular tetrahedra do not fill space (here: no locally finite tiling by similar copies of teSet)"
      lean: "PlatonicFillLean.aristotle_error"
      module: "Challenge"
      status: "proved"
    - source: "Gabbrielli-Jiao-Torquato 2012, p. 3: the regular octahedron alone"
