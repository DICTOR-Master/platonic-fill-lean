    type: "paper"
    location: "Notices of the American Mathematical Society 59 (2012) 1540-1549"
    relationship: "independently-proves"
    note: >-
      Cited for the history (not read in full; known through its summaries):
      Aristotle's claim in De Caelo III.8 that regular tetrahedra fill
      space, and its refutation. aristotle_error is the Lean proof of the
      statement that space cannot be tiled by regular tetrahedra, here for
      similar copies of any sizes, not necessarily face to face.
    author_endorsement: "n/a"
  - title: "De Caelo (On the Heavens), Book III, chapter 8"
    authors:
      - "Aristotle"
    type: "book"
    location: "Book III, chapter 8"
    relationship: "background"
    note: >-
      Cited only (not read). The claim that regular tetrahedra (and cubes)
      fill space, which aristotle_error refutes.
    author_endorsement: "n/a"
  - title: "Regiomontanus's refutation of Aristotle's claim (15th century)"
    authors:
      - "Regiomontanus (Johannes Müller)"
    type: "other"
    location: "Known through the histories cited here (Lagarias-Zong 2012; history notes of UC Riverside, Math 153)"
    relationship: "background"
    note: >-
      Cited only (not read). The refutation is credited to Regiomontanus;
      his text is not known to survive. The entry claims only the Lean
      proof.
    author_endorsement: "n/a"
  - title: "Irrational Numbers"
    authors:
      - "I. Niven"
    type: "book"
    location: "Carus Mathematical Monographs 11, Mathematical Association of America (1956)"
    relationship: "background"
    note: >-
      Cited only (not read). Niven's theorem on the rational values of the
      cosine at rational multiples of pi, used through Mathlib's niven for
      the linear independence of pi, alpha, beta, gamma over Q (lemma3 of
      the library, Packets/Angles.lean).
    author_endorsement: "n/a"
  - title: "Families of tessellations of space by elementary polyhedra via retessellations of face-centered-cubic and related tilings"
    authors:
      - "R. Gabbrielli"
      - "Y. Jiao"
      - "S. Torquato"
    id: "doi:10.1103/PhysRevE.86.041141"
    type: "paper"
    location: "Physical Review E 86 (2012) 041141; page 3"
    relationship: "independently-proves"
    note: >-
      Read (pages 1-3). States, from the dihedral angles, that no pair of
      regular polyhedra fills space, periodically or not, apart from
      tetrahedra and octahedra (and cubes). octa_alone, dodeca_alone,
      icosa_alone and platonic_mix are Lean proofs of parts of this
      statement, with rational-angle helper tiles added; the positive part
      (tetrahedra and octahedra together) is not formalized.
    author_endorsement: "n/a"

  - title: "On angles whose squared trigonometric functions are rational"
    authors:
      - "J. H. Conway"
      - "C. Radin"
      - "L. Sadun"
    id: "arXiv:math-ph/9812019"
    type: "paper"
    location: "Discrete and Computational Geometry 22 (1999) 321-332; Table 3"
    relationship: "background"
    note: >-
      Cited only (abstract read). The rational (in)dependence of the
      dihedral angles of the Platonic and Archimedean polyhedra, which the
      library's lemma3 (pi, alpha, beta, gamma linearly independent over Q)
      covers for the angles used here. The Lean proof does not follow this
      paper: it uses Niven's theorem (Mathlib niven) and a field argument.
    author_endorsement: "n/a"

