      status: "proved"
    - source: "the tetrahedron with rational-angle helpers"
      lean: "PlatonicFillLean.no_tetra"
      module: "Challenge"
      status: "proved"
    - source: "the octahedron with rational-angle helpers"
      lean: "PlatonicFillLean.no_octa"
      module: "Challenge"
      status: "proved"
    - source: "the dodecahedron with rational-angle helpers"
      lean: "PlatonicFillLean.no_dodeca"
