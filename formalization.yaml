      status: "proved"
    - source: "Gabbrielli-Jiao-Torquato 2012, p. 3: the regular dodecahedron alone"
      lean: "PlatonicFillLean.dodeca_alone"
      module: "Challenge"
      status: "proved"
    - source: "Gabbrielli-Jiao-Torquato 2012, p. 3: the regular icosahedron alone"
      lean: "PlatonicFillLean.icosa_alone"
