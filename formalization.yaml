# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 (Palomar submission kit; source rule: SOURCE-BASED, known theorems "independently-proves")
version: "v0.4"

project:
  name: "Aristotle's Error, Machine-Checked: Regular Tetrahedra Do Not Fill Space"
  description: >-
    Aristotle (De Caelo III.8) claimed that regular tetrahedra fill space;
    the refutation is credited to Regiomontanus, and the history is told by
    Lagarias and Zong (2012). This entry proves in Lean that there is no
    tiling of 3-space by similar copies of the regular tetrahedron, and the
    same for the regular octahedron, dodecahedron and icosahedron. Tiles are
    convex polytopes, need not meet face to face, and may each have their
    own scale. With helper tiles whose dihedral angles are nonnegative
    rational multiples of pi (cubes, for instance), no tile is a copy of
    the polyhedron; in a tiling by the five Platonic polyhedra and such
    helpers, no tile is a dodecahedron or an icosahedron. The proof reads
    each dihedral angle from the set, uses that the angles round an edge
    add up to 2 pi (each a dihedral angle, pi or 2 pi), and that pi,
    arctan of the golden ratio, arccos(1/sqrt 6) and arccos(sqrt(2/3)) are
    linearly independent over Q, by Niven's theorem (Mathlib niven) and a
    field argument. Tilings are locally finite by definition, and each
    polyhedron is one fixed set in exact coordinates. None of
    these theorems is new; the entry gives their Lean proofs. Audience:
    researchers on tilings and polyhedra, and Mathlib contributors.
  authors:
    - name: "DICTO"
      orcid: "0009-0001-2620-2036"
      github: "DICTOR-Master"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "DICTO"
      orcid: "0009-0001-2620-2036"
      github: "DICTOR-Master"

classification:
  arxiv: ["math.MG"]
  msc2020: ["52C22", "52B10", "11J72", "03B35"]

